name: CI/CD

on:
  push:
    branches:
      - prod

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 3
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: true
      - run: git log --pretty=oneline

      - name: JDK 17을 설치합니다.
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: gradlew 권한을 부여합니다.
        run: chmod +x gradlew

      - name: Gradle을 통해 빌드합니다.
        run: ./gradlew build

      - name: 빌드 파일 deploy 파일로 이동
        shell: bash {0}
        run: |
          mkdir -p /home/thdwoqor/deploy
          cp -f build/libs/*.jar /home/thdwoqor/deploy/

      - name: 배포 스크립트 실행
        run: |
          cd /home/thdwoqor/deploy
          sh deploy.sh
